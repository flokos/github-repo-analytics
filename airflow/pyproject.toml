[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PT", "S"]

[tool.ruff.lint.isort]
# The helper package is first-party: it lives in the DAGs folder, which Airflow puts on sys.path.
known-first-party = ["github_analytics"]

[tool.ruff.lint.per-file-ignores]
# The DAG's docstring is rendered as a Markdown table in the Airflow UI and cannot be wrapped.
"dags/github_metrics_daily.py" = ["E501"]
# Tests assert, and use obviously fake tokens.
"tests/*" = ["S101", "S105", "S106", "S107"]
