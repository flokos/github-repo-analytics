# Local development and demonstration stack. Not a production deployment:
# see docs/ARCHITECTURE.md ("Security limits of the local setup").
#
# First run:  ./scripts/bootstrap-env.sh && docker compose up --build

name: github-repo-analytics

# --------------------------------------------------------------------------------------------------
# Shared definitions
# --------------------------------------------------------------------------------------------------
x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Missing .env - run ./scripts/bootstrap-env.sh first}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  REPOSITORY_CREATE_THROTTLE: ${REPOSITORY_CREATE_THROTTLE:-30/min}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Missing .env - run ./scripts/bootstrap-env.sh first}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${ANALYTICS_DB_NAME:-analytics}
  DATABASE_USER: ${ANALYTICS_DB_USER:-analytics}
  DATABASE_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: github-repo-analytics-backend:local
  environment: *backend-environment
  restart: unless-stopped

# Every Airflow component runs the same image with the same configuration.
x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__PARALLELISM: "8"
  # Workers talk to the API server's execution API instead of the metadata database.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # The next three secrets must be identical in every Airflow container. Left to their defaults,
  # each container would generate its own and reject the others' tokens.
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Missing .env - run ./scripts/bootstrap-env.sh first}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Missing .env - run ./scripts/bootstrap-env.sh first}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Missing .env - run ./scripts/bootstrap-env.sh first}
  AIRFLOW__API_AUTH__JWT_ISSUER: airflow
  AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  # CeleryExecutor: Redis database 0 as broker, PostgreSQL as result backend, a queue of its own.
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  AIRFLOW__OPERATORS__DEFAULT_QUEUE: airflow_tasks
  AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-4}
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  # Read by the DAG file when it is parsed (by the DAG processor and again by the worker).
  PIPELINE_SCHEDULE_CRON: ${PIPELINE_SCHEDULE_CRON:-0 6 * * *}
  PIPELINE_SCHEDULE_TIMEZONE: ${PIPELINE_SCHEDULE_TIMEZONE:-UTC}

x-airflow: &airflow
  build:
    context: ./airflow
    target: runtime
  image: github-repo-analytics-airflow:local
  environment: *airflow-environment
  volumes:
    # The image already contains the DAGs; mounting the folder read-only on top lets edits show
    # up without a rebuild.
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

x-airflow-depends-on: &airflow-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  # ------------------------------------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/, so the volume is
      # mounted one level higher than it was for 17 and earlier.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # TCP check on purpose: the temporary server used while init scripts run listens on the
      # Unix socket only, so the container is not reported healthy before the databases exist.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Message broker only: nothing here needs to survive a restart, so persistence is off.
    # Logical database 0 belongs to the Airflow CeleryExecutor, database 1 to Django Celery.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------------
  # Django
  # ------------------------------------------------------------------------------------------------
  backend-migrate:
    <<: *backend
    # One-shot: applies Django migrations, then exits. `api` waits for it.
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------------------------------------
  # Airflow (CeleryExecutor)
  # ------------------------------------------------------------------------------------------------
  airflow-init:
    <<: *airflow
    # One-shot: the image entrypoint migrates the metadata database and creates the admin user,
    # then the command fails loudly if any migration is still missing.
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
    command: ["db", "check-migrations", "--migration-wait-timeout", "60"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on: *airflow-depends-on

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on: *airflow-depends-on

  airflow-dag-processor:
    <<: *airflow
    # Parses DAG files. In Airflow 3 this is always a separate process from the scheduler.
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on: *airflow-depends-on

  airflow-worker:
    <<: *airflow
    # Executes every task instance, including each dynamically mapped one.
    command: ["celery", "worker"]
    environment:
      <<: *airflow-environment
      # Lets `docker compose stop` shut the Celery worker down gracefully.
      DUMB_INIT_SETSID: "0"
      # Connections exist only here: the worker is the one component that runs task code, so it
      # is the only one that holds the GitHub and internal API tokens.
      AIRFLOW_CONN_GITHUB_API: '{"conn_type": "http", "schema": "https", "host": "api.github.com", "password": "${GITHUB_TOKEN:-}"}'
      AIRFLOW_CONN_DJANGO_INTERNAL_API: '{"conn_type": "http", "schema": "http", "host": "api", "port": 8000, "password": "${INTERNAL_API_TOKEN:?Missing .env - run ./scripts/bootstrap-env.sh first}"}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      <<: *airflow-depends-on
      airflow-apiserver:
        condition: service_healthy

  # ------------------------------------------------------------------------------------------------
  # Test runners: `docker compose --profile test run --rm <service>`
  # ------------------------------------------------------------------------------------------------
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: github-repo-analytics-backend-tests:local
    environment: *backend-environment
    # Lint, format check, then the test suite against a throwaway PostgreSQL database.
    command: ["sh", "-c", "ruff check . && ruff format --check . && pytest"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-tests:
    profiles: ["test"]
    build:
      context: ./airflow
      target: test
    image: github-repo-analytics-airflow-tests:local
    # Self-contained: a throwaway SQLite metadata database and fake connections. Nothing here
    # reaches the real services or the network.
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-tests.db
      AIRFLOW_CONN_GITHUB_API: '{"conn_type": "http", "schema": "https", "host": "api.github.com", "password": "test-github-token"}'
      AIRFLOW_CONN_DJANGO_INTERNAL_API: '{"conn_type": "http", "schema": "http", "host": "api", "port": 8000, "password": "test-internal-token"}'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - cd /opt/airflow && ruff check dags tests && ruff format --check dags tests && airflow db migrate > /tmp/db-migrate.log 2>&1 && pytest

volumes:
  postgres-data:
  airflow-logs:
