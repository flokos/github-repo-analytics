# Local development and demonstration stack. Not a production deployment:
# see docs/ARCHITECTURE.md ("Security limits of the local setup").
#
# First run:  ./scripts/bootstrap-env.sh && docker compose up --build

name: github-repo-analytics

# --------------------------------------------------------------------------------------------------
# Shared definitions
# --------------------------------------------------------------------------------------------------
x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Missing .env - run ./scripts/bootstrap-env.sh first}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  REPOSITORY_CREATE_THROTTLE: ${REPOSITORY_CREATE_THROTTLE:-30/min}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Missing .env - run ./scripts/bootstrap-env.sh first}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${ANALYTICS_DB_NAME:-analytics}
  DATABASE_USER: ${ANALYTICS_DB_USER:-analytics}
  DATABASE_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: github-repo-analytics-backend:local
  environment: *backend-environment
  restart: unless-stopped

services:
  # ------------------------------------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/, so the volume is
      # mounted one level higher than it was for 17 and earlier.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # TCP check on purpose: the temporary server used while init scripts run listens on the
      # Unix socket only, so the container is not reported healthy before the databases exist.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Message broker only: nothing here needs to survive a restart, so persistence is off.
    # Logical database 0 belongs to the Airflow CeleryExecutor, database 1 to Django Celery.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------------
  # Django
  # ------------------------------------------------------------------------------------------------
  backend-migrate:
    <<: *backend
    # One-shot: applies Django migrations, then exits. `api` waits for it.
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------------------------------------
  # Test runners: `docker compose --profile test run --rm <service>`
  # ------------------------------------------------------------------------------------------------
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: github-repo-analytics-backend-tests:local
    environment: *backend-environment
    # Lint, format check, then the test suite against a throwaway PostgreSQL database.
    command: ["sh", "-c", "ruff check . && ruff format --check . && pytest"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
