# Local development and demonstration stack. Not a production deployment:
# see docs/ARCHITECTURE.md ("Security limits of the local setup").
#
# First run:  ./scripts/bootstrap-env.sh && docker compose up --build

name: github-repo-analytics

services:
  # ------------------------------------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-analytics}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Missing .env - run ./scripts/bootstrap-env.sh first}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/, so the volume is
      # mounted one level higher than it was for 17 and earlier.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # TCP check on purpose: the temporary server used while init scripts run listens on the
      # Unix socket only, so the container is not reported healthy before the databases exist.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Message broker only: nothing here needs to survive a restart, so persistence is off.
    # Logical database 0 belongs to the Airflow CeleryExecutor, database 1 to Django Celery.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
