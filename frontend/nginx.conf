# Serves the built dashboard and forwards its API calls to Django, so the browser only ever
# talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `api` per request (through the variable below) keeps the
    # proxy working when the API container is recreated and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Everything the dashboard loads comes from this origin; nothing is inlined.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # The pipeline's internal endpoints are never reachable through the dashboard's origin.
    # (They additionally require a bearer token on the API itself.)
    location /api/internal/ {
        default_type application/json;
        return 404 '{"error": {"code": "not_found", "message": "This endpoint does not exist.", "details": {}}}';
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The entry document is revalidated so that a new build is picked up straight away.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
